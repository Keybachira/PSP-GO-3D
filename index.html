<!doctype html>
<html lang="pt">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>PSP Go 3D</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <h1>PSP Go</h1>
            <p>Arrasta para rodar · roda do rato para zoom</p>
        </header>
        <nav>
            <button id="bSlide">Abrir / Fechar</button>
            <button id="bFront">Frente</button>
            <button id="bBack">Costas</button>
            <button id="bAuto">Rotação auto</button>
            <button id="bEx">Desmontar</button>
            <button id="bXr">Esqueleto</button>
            <button id="bTop">Topo</button>
            <button id="bScr">Ecrã: Store</button>
        </nav>
        <div class="hud">
            PSP::GO · FPS::<span id="fps">60</span> · BAT::100% · PRESENCE::ON
        </div>
        <div class="brand">PSP<b>Go</b> <span>:: Lab</span></div>
        <div class="frame"></div>
        <div class="tabs" id="tabs">
            <button data-m="play" class="on">PLAY</button
            ><button data-m="orbit">ORBIT</button
            ><button data-m="apart">APART</button
            ><button data-m="xray">X-RAY</button
            ><button data-m="top">TOPO</button>
        </div>
        <aside class="panel">
            <div class="row"><span>← ↑ → ↓</span><b>Mover</b></div>
            <div class="row"><span>W A S D</span><b>△ □ ✕ ○</b></div>
            <div class="row"><span>Q · E</span><b>L · R</b></div>
            <div class="row">
                <span>Enter · Shift</span><b>Start · Select</b>
            </div>
            <div class="row"><span>H · + · −</span><b>Home · Vol</b></div>
            <div class="tg">
                <span>Slider</span><i id="tSl" class="sw on"></i>
            </div>
            <div class="tg"><span>Som</span><i id="tSn" class="sw on"></i></div>
            <div class="tg">
                <span>Ligada</span><i id="tPw" class="sw on"></i>
            </div>
            <div class="mini">
                <button onclick="bFront.click()">Frente</button
                ><button onclick="bBack.click()">Costas</button>
            </div>
            <small
                >Clica nos botões da consola · arrasta para rodar · analógico:
                arrasta o nub</small
            >
        </aside>
        <div class="pager">
            <button id="pPrev">←</button><span id="pTxt">01/04</span
            ><button id="pNext">→</button>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
